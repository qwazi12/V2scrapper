[project]
name = "screen-central-os"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "boto3>=1.36,<2",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20",
    "pyyaml>=6,<7",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=45,<51",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
 "ruff>=0.11,<1",
 "openapi-spec-validator>=0.7,<1",
 "moto[server]==5.2.5",
]
[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
