components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: __Host-scos_session
      description: HttpOnly Secure SameSite=Lax cookie; server session store. Cross-site mutation blocked via Origin
        and X-CSRF-Token.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - trace_id
      additionalProperties: true
    Page:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        count:
          type: integer
        total_estimate:
          type:
          - integer
          - 'null'
      required:
      - count
      additionalProperties: true
    Session:
      type: object
      properties:
        user_id: *id001
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - editor
          - viewer
        environment:
          type: string
          enum:
          - local
          - ci
          - staging
          - production
      required:
      - user_id
      - email
      - role
      - environment
      additionalProperties: false
    Capability:
      type: object
      properties:
        provider:
          type: string
        account_id: *id001
        can_upload_video:
          type: boolean
        can_publish_reels:
          type: boolean
        can_publish_images:
          type: boolean
        can_publish_carousel:
          type: boolean
        can_list_comments:
          type: boolean
        can_reply:
          type: boolean
        can_read_analytics:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        last_verified_at: &id003
          type: string
          format: date-time
        last_error:
          type:
          - string
          - 'null'
      required:
      - provider
      - account_id
      additionalProperties: false
    Account:
      type: object
      properties:
        id: *id001
        platform:
          type: string
          enum:
          - youtube
          - instagram
          - facebook
          - other
        display_name:
          type: string
        handle:
          type:
          - string
          - 'null'
        external_account_id:
          type: string
        publish_enabled:
          type: boolean
        read_enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capability'
      required:
      - id
      - platform
      - display_name
      - external_account_id
      - publish_enabled
      additionalProperties: false
    OpportunityCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        audience_hypothesis:
          type: string
          minLength: 5
        angle:
          type: string
        payoff:
          type: string
        why_us:
          type: string
        evidence_urls:
          type: array
          items: *id002
      required:
      - title
      - audience_hypothesis
      additionalProperties: false
    Opportunity:
      type: object
      properties:
        id: *id001
        title:
          type: string
        audience_hypothesis:
          type: string
        angle:
          type: string
        payoff:
          type: string
        why_us:
          type: string
        status:
          type: string
          enum:
          - new
          - triaged
          - research_pending
          - researching
          - researched
          - accepted
          - rejected
          - deferred
        revision:
          type: integer
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
        created_at: *id003
      required:
      - id
      - title
      - audience_hypothesis
      - status
      - revision
      additionalProperties: false
    OpportunityPatch:
      type: object
      properties:
        angle:
          type: string
        payoff:
          type: string
        why_us:
          type: string
        status:
          type: string
          enum:
          - triaged
          - deferred
          - rejected
        reason:
          type: string
        expected_revision:
          type: integer
      required:
      - expected_revision
      additionalProperties: false
    Signal:
      type: object
      properties:
        source_name:
          type: string
        measurement_kind:
          type: string
        observed_at: *id003
        period_start: *id003
        period_end: *id003
        value:
          type:
          - number
          - 'null'
        units:
          type: string
        confidence:
          type: string
          enum:
          - observed
          - estimated
          - heuristic
          - opinion
          - unknown
        evidence_url: *id002
      required:
      - source_name
      - measurement_kind
      - confidence
      additionalProperties: false
    SourceCreate:
      type: object
      properties:
        provider:
          type: string
        uri: *id002
        source_kind:
          type: string
        title:
          type: string
        published_at: *id003
      required:
      - provider
      - uri
      additionalProperties: false
    Source:
      type: object
      properties:
        id: *id001
        provider:
          type: string
        uri: *id002
        retrieved_at: *id003
        published_at: *id003
        content_sha256: &id004
          type: string
          pattern: ^[0-9a-f]{64}$
        trust_class:
          type: string
        title:
          type: string
        snippet:
          type: string
        rights_to_store:
          type: string
      required:
      - id
      - provider
      - uri
      - retrieved_at
      additionalProperties: false
    ClaimCreate:
      type: object
      properties:
        opportunity_id: *id001
        subject_entity_id: *id001
        text:
          type: string
          minLength: 5
        kind:
          type: string
        epistemic_type:
          type: string
          enum:
          - fact
          - inference
          - opinion
          - rumor
          - unknown
        factual_value:
          type: object
          additionalProperties: true
      required:
      - opportunity_id
      - text
      - kind
      - epistemic_type
      additionalProperties: false
    Claim:
      type: object
      properties:
        id: *id001
        opportunity_id: *id001
        text:
          type: string
        kind:
          type: string
        epistemic_type:
          type: string
        status:
          type: string
          enum:
          - proposed
          - evidence_pending
          - supported
          - contradicted
          - uncertain
          - rejected
        revision:
          type: integer
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
      required:
      - id
      - text
      - kind
      - epistemic_type
      - status
      - revision
      additionalProperties: false
    Evidence:
      type: object
      properties:
        id: *id001
        claim_id: *id001
        source_id: *id001
        stance:
          type: string
          enum:
          - supports
          - contradicts
          - mentions
          - unknown
        locator:
          type: string
        excerpt:
          type: string
        review_method:
          type: string
        reviewed_at: *id003
      required:
      - id
      - claim_id
      - source_id
      - stance
      - locator
      additionalProperties: false
    EvidenceReview:
      type: object
      properties:
        source_id: *id001
        stance:
          type: string
          enum:
          - supports
          - contradicts
          - mentions
          - unknown
        locator:
          type: string
          minLength: 1
        excerpt:
          type: string
        structured_field:
          type: string
        reason:
          type: string
      required:
      - source_id
      - stance
      - locator
      - reason
      additionalProperties: false
    ResearchPackageCreate:
      type: object
      properties:
        opportunity_id: *id001
        claim_ids:
          type: array
          items: *id001
        summary:
          type: string
        policy_version:
          type: string
      required:
      - opportunity_id
      - claim_ids
      - summary
      - policy_version
      additionalProperties: false
    ResearchPackage:
      type: object
      properties:
        id: *id001
        opportunity_id: *id001
        revision:
          type: integer
        claim_ids:
          type: array
          items: *id001
        status:
          type: string
          enum:
          - draft
          - blocked
          - approved
          - revoked
        content_hash: *id004
        blockers:
          type: array
          items:
            type: string
      required:
      - id
      - opportunity_id
      - revision
      - status
      - content_hash
      additionalProperties: false
    Decision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - defer
          - revoke
        reason:
          type: string
          minLength: 3
        expected_hash: *id004
      required:
      - decision
      - reason
      additionalProperties: false
    CampaignCreate:
      type: object
      properties:
        opportunity_id: *id001
        research_package_id: *id001
        title:
          type: string
        viewer_promise:
          type: string
          minLength: 6
        original_angle:
          type: string
          minLength: 6
        series_name:
          type: string
        spoiler_policy:
          type: string
      required:
      - research_package_id
      - title
      - viewer_promise
      - original_angle
      additionalProperties: false
    Campaign:
      type: object
      properties:
        id: *id001
        opportunity_id: *id001
        research_package_id: *id001
        title:
          type: string
        viewer_promise:
          type: string
        original_angle:
          type: string
        status:
          type: string
        revision:
          type: integer
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
      required:
      - id
