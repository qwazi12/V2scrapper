          - short_9_16
          - reel_9_16
          - carousel_4_5
          - image_1_1
          - story_9_16
          - text_post
        angle:
          type: string
          minLength: 5
        intended_platform:
          type: string
        target_duration_ms:
          type: integer
          minimum: 1
        config:
          type: object
          additionalProperties: true
      required:
      - format
      - angle
      additionalProperties: false
    Variant:
      type: object
      properties:
        id: *id001
        campaign_id: *id001
        format:
          type: string
        angle:
          type: string
        status:
          type: string
        target_duration_ms:
          type: integer
        script_revision:
          type: integer
      required:
      - id
      - campaign_id
      - format
      - angle
      - status
      additionalProperties: false
    ScriptRevision:
      type: object
      properties:
        revision:
          type: integer
        text:
          type: string
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/Sentence'
        text_sha256: *id004
        status:
          type: string
      required:
      - revision
      - text
      - sentences
      - text_sha256
      - status
      additionalProperties: false
    Sentence:
      type: object
      properties:
        sentence_id:
          type: string
        text:
          type: string
        kind:
          type: string
          enum:
          - factual
          - interpretation
          - opinion
          - transition
          - cta
        claim_refs:
          type: array
          items: *id001
        beat_index:
          type: integer
          minimum: 0
      required:
      - sentence_id
      - text
      - kind
      - claim_refs
      additionalProperties: false
    ScriptUpdate:
      type: object
      properties:
        expected_revision:
