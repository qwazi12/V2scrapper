name: scos-local
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: scos_local
      POSTGRES_USER: scos
      POSTGRES_PASSWORD: scos_local_only
    ports:
    - 127.0.0.1:55432:5432
    volumes:
    - scos_pg:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U scos -d scos_local
      interval: 2s
      retries: 30
volumes:
  scos_pg: null
