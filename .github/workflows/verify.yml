name: Verify SCOS isolated local stack
on:
  push:
    branches: [main, staging-readiness]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: scos
          POSTGRES_PASSWORD: scos_local_only
          POSTGRES_DB: scos_test
        ports: ['55432:5432']
        options: --health-cmd="pg_isready -U scos -d scos_test" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install isolated dependencies
        run: |
          python -m pip install uv==0.7.13
          uv sync --frozen
          npm --prefix apps/web ci --no-fund --no-audit
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          cd apps/web && npx playwright install --with-deps chromium
      - name: Start local S3 emulator
        run: |
          uv run moto_server -H 127.0.0.1 -p 59000 > /tmp/scos-moto.log 2>&1 &
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:59000 && break; sleep 1; done
      - run: make lint test-backend test-contracts build
      - name: Start E2E stack in a separate database
        run: |
          uv run python scripts/prepare_e2e.py
          SCOS_DATABASE_URL=postgresql://scos:scos_local_only@127.0.0.1:55432/scos_e2e SCOS_S3_BUCKET=scos-e2e PYTHONPATH=services/api uv run uvicorn scos.app:app --host 127.0.0.1 --port 8101 --no-access-log > /tmp/scos-api.log 2>&1 &
          SCOS_DATABASE_URL=postgresql://scos:scos_local_only@127.0.0.1:55432/scos_e2e SCOS_S3_BUCKET=scos-e2e PYTHONPATH=services/api uv run python -m scos.worker > /tmp/scos-worker.log 2>&1 &
          SCOS_API_URL=http://127.0.0.1:8101 npm --prefix apps/web run dev -- --port 3101 > /tmp/scos-web.log 2>&1 &
          for n in $(seq 1 60); do curl -sf http://127.0.0.1:3101 && break; sleep 1; done
      - run: npm --prefix apps/web run test:e2e
      - name: Upload synthetic test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scos-test-evidence
          path: |
            artifacts/backend-tests.xml
            artifacts/browser-results.json
            apps/web/artifacts/*.png
          retention-days: 7
